  <title>张博思远（Jumpson）｜个人职业作品集</title>
  <style>
    :root {

    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1D1D1F;

      --text: #F5F5F7;

      --accent: #66C2A5;
      --accent-rgb: 102, 194, 165;

      --media-stage: #0B0B0D;

    }

    svg { display: block; }
    [hidden] { display: none !important; }

    .skip-link {
      position: fixed;
      z-index: 500;
      top: 10px;
      left: 10px;
      transform: translateY(-150%);
      padding: 10px 14px;

      color: #fff;

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      border: 0;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    :focus-visible { outline: 3px solid rgba(var(--primary-rgb), .38); outline-offset: 3px; }

    .container { width: min(100% - 56px, 1180px); margin-inline: auto; }
    .section { padding-block: var(--section-pad); scroll-margin-top: 80px; }
    .section-heading { max-width: 16ch; margin: 0 0 var(--sp-8); font-size: clamp(2.15rem, 5vw, 3.35rem); font-weight: var(--fw-bold); letter-spacing: -.035em; line-height: 1.06; text-wrap: balance; }
    .eyebrow { margin: 0 0 12px; color: var(--text-2); font-size: .875rem; font-weight: var(--fw-bold); letter-spacing: .02em; }

    .nav-shell {

      z-index: 100;
      height: var(--nav-h);
      border-bottom: 1px solid transparent;
      transition: background-color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
    }
    .nav-shell.is-scrolled { border-color: var(--line); background: color-mix(in srgb, var(--surface) 82%, transparent); box-shadow: 0 1px 0 rgba(0, 0, 0, .02); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); }
    .nav-inner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; height: 100%; }

    .nav-link::after { position: absolute; right: 0; bottom: 3px; left: 0; height: 2px; transform: scaleX(0); border-radius: var(--radius-pill); background: var(--primary); content: ""; transition: transform var(--dur-fast) var(--ease-out); }
    .nav-link.is-active { color: var(--primary); }
    .nav-link.is-active::after { transform: scaleX(1); }
    .nav-shell.is-switching { pointer-events: none; }
    .nav-actions, .language-switch { display: flex; align-items: center; }
    .nav-actions { gap: 8px; }
    .language-switch { padding: 3px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); }
    .language-button { min-width: 42px; min-height: 38px; padding: 4px 9px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text-2); font-size: .75rem; font-weight: var(--fw-bold); cursor: pointer; }
    .language-button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
    .icon-button, .menu-button, .back-to-top { display: inline-grid; width: 44px; height: 44px; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-btn); background: var(--surface); cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
    .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 20px; border: 1px solid transparent; border-radius: var(--radius-btn); font-weight: 700; cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
    .button--primary { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
    .button--secondary { border-color: var(--line); background: var(--surface); color: var(--text); }
    .menu-button { display: none; }

    main, footer { transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out); }
    .view-stack { min-height: calc(100vh - var(--nav-h)); }
    .view { min-height: calc(100vh - var(--nav-h)); padding-top: var(--nav-h); }
    .view-home { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    .view.is-active { display: block; }
    .view-home.is-active { display: grid; }
    .hero { display: grid; align-items: center; padding-top: 0; padding-bottom: 0; }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr); align-items: center; gap: clamp(48px, 7vw, 96px); padding-block: clamp(48px, 8vh, 96px) var(--sp-7); }
    .avatar { width: 128px; aspect-ratio: 1; display: grid; place-items: center; margin-bottom: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: 50%; background: var(--surface-2); color: var(--text-2); }
    .avatar svg { width: 56%; height: 56%; opacity: .7; }
    .hero h1 { max-width: 11ch; margin: 0; font-size: clamp(3rem, 7vw, 5.4rem); font-weight: var(--fw-bold); line-height: .98; text-wrap: balance; }
    html[lang="zh-CN"] .hero h1 { letter-spacing: -.02em; }
    html[lang="ko"] .hero h1, html[lang="en"] .hero h1 { letter-spacing: -.01em; }
    .hero-name-en { margin: 12px 0 20px; color: var(--text-2); font-size: 1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .hero-role { margin: 0; max-width: 620px; font-size: clamp(1.2rem, 2vw, 1.55rem); font-weight: 600; letter-spacing: -.01em; }
    .hero-org { margin: 8px 0 0; color: var(--text); font-size: .95rem; font-weight: var(--fw-semibold); }
    .hero-copy { max-width: 56ch; margin: 20px 0 0; color: var(--text-2); font-size: 1.02rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .trait-panel { display: grid; gap: 30px; padding: clamp(28px, 4vw, 42px); border-radius: calc(var(--radius-card) + 6px); background: var(--surface); box-shadow: var(--shadow); }
    .trait-block { display: grid; gap: 14px; }
    .trait-block + .trait-block { padding-top: 4px; }
    @media (prefers-reduced-motion: no-preference) {
      .view-home.play-intro .trait-block { animation: hero-in var(--dur-slow) var(--ease-out) both; }
    }
    .view-home.play-intro .trait-block[data-trait-block="2"] { animation-delay: 120ms; }
    .view-home.play-intro .trait-block[data-trait-block="3"] { animation-delay: 180ms; }
    .trait-label { margin: 0; color: var(--text-2); font-size: .875rem; font-weight: 700; letter-spacing: .06em; }
    .trait-badge { margin: 0; color: var(--text); font-size: clamp(1.75rem, 3vw, 2rem); font-weight: var(--fw-bold); letter-spacing: var(--num-track); line-height: 1; }
    .mbti-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--trait-gap); margin: 0; padding: 0; list-style: none; }
    .mbti-cell { min-height: var(--trait-cell); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: .9rem; }
    .mbti-cell.is-neutral { border: 1px dashed var(--line); color: var(--text-2); }
    .mbti-cell.is-neutral span { opacity: .4; }
    .mbti-cell.is-set { background: rgba(var(--primary-rgb), .12); color: var(--text-2); font-weight: 700; }
    .mbti-cell.is-set strong { color: var(--primary); font-weight: 800; }
    .hobby-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
    .hobby-card { display: grid; justify-items: center; gap: 10px; padding: 14px 8px; border-radius: 12px; background: var(--surface-2); text-align: center; }
    .hobby-icon { width: var(--trait-cell); height: var(--trait-cell); display: grid; place-items: center; flex: 0 0 auto; border-radius: 12px; background: rgba(var(--accent-rgb), .1); color: var(--accent); }
    .hobby-card > span:last-child { color: var(--text-2); font-size: .8125rem; }
    .trait-inline { position: relative; display: flex; align-items: center; gap: 12px; margin: 0; color: var(--text); font-size: .875rem; font-weight: 600; }
    .trait-inline::after { position: absolute; z-index: 0; right: 0; bottom: 7px; left: 58px; height: 1px; background: var(--line); content: ""; }
    .trait-inline > * { position: relative; z-index: 1; }
    .trait-inline > span:last-child { padding-right: 8px; background: var(--surface); }

    .highlights { padding-block: var(--section-pad); scroll-margin-top: 80px; }
    .view-home .highlights { padding-block: var(--sp-6) var(--sp-7); }
    .highlight-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 0; overflow: hidden; border-block: 1px solid var(--line); }
    .highlight-item { min-width: 0; min-height: 112px; display: grid; grid-template-rows: auto auto; align-content: center; gap: var(--sp-3); padding: var(--sp-5); }
    .highlight-value { min-height: calc(var(--num-size) * var(--num-leading)); display: inline-flex; align-items: baseline; color: var(--text); font-family: var(--font-num); font-size: var(--num-size); font-weight: var(--num-weight); font-variant-numeric: lining-nums proportional-nums; font-feature-settings: "lnum" 1; letter-spacing: var(--num-track); line-height: var(--num-leading); }
    .hl-mark { color: var(--text-2); font-size: var(--num-mark-size); font-weight: var(--num-mark-weight); letter-spacing: var(--num-mark-track); line-height: 1; }
    .hl-mark:not(.hl-mark--sign) { margin-left: var(--num-mark-gap); }
    .hl-mark--sign { margin-right: calc(var(--num-mark-gap) / 2); }
    .highlight-label { min-height: 3em; margin: 0; color: var(--text-2); font-size: .875rem; letter-spacing: .01em; line-height: 1.5; }
    html[lang="ko"] .highlight-label { letter-spacing: .02em; }

    .panel-card { padding: var(--card-pad); border: 1px solid transparent; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow); }
    .experience-head { display: grid; grid-template-columns: 1fr auto; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .experience-head h3 { margin: 0; font-size: 1.35rem; }
    .experience-head p { margin: 4px 0 0; color: var(--text-2); }
    .experience-meta { display: grid; justify-items: end; gap: 8px; }
    .experience-date { color: var(--text-2); font-size: .875rem; }
    .status-chip { display: inline-flex; min-height: 27px; align-items: center; padding: 3px 10px; border: 1px solid rgba(var(--accent-rgb), .28); border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: var(--fw-bold); }
    .timeline { counter-reset: responsibility; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 48px; margin-top: 32px; }
    .timeline-item { counter-increment: responsibility; display: grid; grid-template-columns: 48px 1fr; align-content: start; column-gap: 16px; }
    .timeline-item::before { grid-row: 1 / span 2; color: var(--text-2); font-size: .78rem; font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; letter-spacing: .08em; content: counter(responsibility, decimal-leading-zero); }
    .timeline-item h3 { margin: 0; color: var(--text); font-size: 1.15rem; }
    .experience-points { grid-column: 2; counter-reset: experience-point; display: grid; gap: 10px; margin: 12px 0 0; padding: 0; list-style: none; }
    .experience-points li { counter-increment: experience-point; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; color: var(--text-2); line-height: 1.65; }
    .experience-points li::before { min-width: 26px; padding-top: 2px; color: var(--primary); font-family: var(--font-num); font-size: .72rem; font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; letter-spacing: .04em; line-height: 1.65; content: counter(experience-point, decimal-leading-zero); }

    .tabs-wrap { margin-bottom: 28px; overflow-x: auto; scrollbar-width: none; }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs { position: relative; min-width: max-content; display: flex; gap: 30px; border-bottom: 1px solid var(--line); }
    .tab { min-height: 48px; padding: 0; border: 0; background: transparent; color: var(--text-2); font-weight: var(--fw-semibold); cursor: pointer; transition: color var(--dur-fast) var(--ease-out); }
    .tab[aria-selected="true"] { color: var(--primary); }
    .tabs-indicator { position: absolute; bottom: -1px; left: 0; width: 1px; height: 2px; transform-origin: left center; border-radius: var(--radius-pill); background: var(--primary); transition: transform var(--dur-base) var(--ease-inout); }
    .tab-panels { position: relative; }
    .panel { animation: panel-in var(--dur-base) var(--ease-out) both; }
    .tab-summary { display: grid; gap: 18px; margin-bottom: 36px; padding: clamp(28px, 4vw, 44px); border: 1px solid transparent; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow); }

    .tab-summary__note { max-width: 82ch; margin: -4px 0 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--text-2); font-size: .8rem; line-height: 1.6; }
    .tab-summary__stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin: 0; padding-top: 20px; border-top: 1px solid var(--line); }
    .tab-summary__stats div { display: grid; gap: 6px; }
    .tab-summary__stats dt { color: var(--text-2); font-size: .78rem; font-weight: var(--fw-medium); }
    .tab-summary__stats dd { margin: 0; font-family: var(--font-num); font-size: clamp(1.4rem, 2.4vw, 1.85rem); font-weight: var(--num-weight); font-variant-numeric: lining-nums proportional-nums; letter-spacing: var(--num-track); line-height: 1.1; }
    .result-row .chip, .chip--date, .pd-counter, .compare-nav span, .project-media-count { font-family: var(--font-num); font-feature-settings: var(--num-meta-feat); }
    .project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: var(--gap-card); }
    .panel#panel-airline .project-grid { grid-template-columns: minmax(0, 760px); justify-content: center; }
    .project-card { position: relative; min-width: 0; overflow: hidden; border: 1px solid transparent; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
    .project-cover { position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); color: var(--text-2); }
    .project-cover::before { position: absolute; width: 62%; aspect-ratio: 1; border: 1px solid rgba(var(--primary-rgb), .22); border-radius: 50%; content: ""; }
    .project-cover.has-media::before { display: none; }
    .project-cover svg { position: relative; }

          ['2607 · Shinsegae Department Store Centum City', 'New-product Pop-up · Beyond the Capital Region', 'Opened the first Busan pop-up at Shinsegae Centum City, Korea’s No. 3 department store by 2025 sales.', 'Opened the first Busan pop-up at Shinsegae Centum City, ranked No. 3 nationally by 2025 sales, testing whether the format could be repeated in a major regional market.'],
          ['2607 · Lotte Jamsil World Mall', 'Strategic New-product Pop-up', 'A 21-day pop-up in Seocho reached both family shoppers and office workers.', 'A 21-day Seocho pop-up reached families and office workers. Together with the April booth pop-up, it tested two activation formats at the same venue: a light-touch event and a longer pop-up.'],
          ['2610 · Lotte Department Store Incheon', 'Brand Store Pilot', 'A long-term Incheon pop-up planned for Oct 2026, targeting local shoppers and airport arrivals. No end date has been confirmed; it is one of three planned October projects.', 'Planned a long-term Incheon pop-up from 1 Oct 2026 for local shoppers and airport arrivals; the end date is open. Alongside planned projects at The Hyundai Seoul and Pyeongchon, it will test how a regional long-term store can be coordinated with two other sites.'],
          ['2610 · The Hyundai Seoul', 'Key Retail Area · Long-term Pop-up', 'Planned a third use of the same venue after Sep 2025 and Apr–Jun 2026.', 'Planned a 28-day October pop-up as the third use of the venue after a Sep 2025 pop-up and an Apr–Jun 2026 long-term store. The project will test whether repeated use of a leading venue can build lasting partnerships and a stronger understanding of customer traffic.'],
          ['2610 · Lotte Department Store Pyeongchon', 'Channel Resource Exchange Pop-up', 'One of three planned October projects, aimed at shoppers in a western Seoul-area new town.', 'Planned for shoppers in a western Seoul-area new town, this is one of three October projects linking venues across Gyeonggi, Incheon, and Seoul.']
        ],
        ko: [
          ['2506 · 롯데 잠실월드몰', '전략형 팝업 · 대표 사례', '2025년 상반기 최대 규모 팝업에서 신제품 출시, 브랜드 단독 매장 연계, 러닝 크루 마케팅을 결합했습니다. 판매량이 채널의 예상치를 크게 웃돌아 후속 프로젝트 제안으로 이어졌습니다.', '매출 순위 2위인 롯데 잠실월드몰의 메인 아트리움을 선정해 2025년 상반기 최대 규모의 팝업을 기획했습니다. 6월 신제품 출시와 함께 신제품 첫선, 브랜드 단독 매장 연계, 러닝 크루 마케팅을 통합했습니다. 판매량이 채널 예상치를 크게 웃돌자 현대와 롯데백화점에서 후속 팝업을 먼저 제안했고, 이를 통해 8월과 9월 프로젝트 기회를 확보했습니다.'],
          ['2508 · 롯데 잠실 월드몰 에비뉴엘', '전략형 팝업 · 효율 개선', '6월 성과를 바탕으로 롯데의 제안으로 성사된 프로젝트입니다. 20일 만에 준비하고 KPI로 운영 효율을 높여 목표 달성률 134%를 기록했습니다.', '6월 성과를 보고 롯데백화점이 먼저 제안한 프로젝트를 20일 안에 준비·실행했습니다. 판매 목표를 SKU별로 나누고 유효한 협의 3회 이내에 최종 홍보물을 확정한다는 KPI를 정해 준비를 2일 일찍 마쳤습니다. 유동인구가 많은 입지와 현장 판매 실행을 결합한 운영 모델을 검증했고, 이후 롯데 잠실 브랜드 단독 매장 기회로 이어졌습니다.'],
          ['2509 · 더현대 서울', '전략형 팝업 · 혁신', 'OKR로 고객·상품·공간을 나눠 설계하고 보상판매, 마케팅 채널 협업, 기프트 박스 A/B 테스트를 처음 도입했습니다. 이 과정에서 만든 운영 방식과 SOP가 2026년 프로젝트 확대의 기반이 됐습니다.', '젊은 고객층과 추석 시즌을 겨냥해 현대백화점의 온·오프라인 연계 팝업을 기획했습니다. OKR로 고객·상품·공간을 나눠 TNK 핑크 신제품, 기프트 박스, 러닝 크루 활동에 추석 프로모션을 더했습니다. 보상판매 정책, 마케팅 채널 2곳과의 첫 유료 협업, 사은품 차등 구성, 기프트 박스 A/B 테스트를 도입했습니다. 축적한 데이터와 운영 방법은 2026년 13건의 팝업 확대를 위한 기반이 됐습니다.'],
          ['2602 · 현대백화점 판교점', '새해 장기 팝업 · 두 달 운영', '판교 테크노밸리의 IT·금융 직장인을 대상으로 35일간 운영하며 기술 산업 상권에서 팝업을 통한 신규 고객 유입 가능성을 검증했습니다.', '35일간 판교 테크노밸리의 IT·금융 직장인에게 집중적으로 다가갔습니다. 이 운영을 통해 기술 산업 상권에서 팝업을 통한 신규 고객 유입과 장기 운영의 가능성을 검증했습니다.'],
          ['2603 · 현대백화점 무역센터점', '신제품 선출시 팝업', '강남 핵심 상권에서 운영하면서 4월의 3개 동시 프로젝트에 필요한 자원과 SOP를 축적했습니다.', '강남 핵심 상권의 유동인구를 대상으로 운영하고 4월의 3개 프로젝트를 동시에 준비했습니다. 그 과정에서 여러 현장을 병행할 때 필요한 자원과 실행 SOP를 점검했습니다.'],
          ['2604 · 현대백화점 판교점', '3개 팝업 동시 운영 · 4월', '4월 동시 운영한 3개 프로젝트 중 하나입니다. 현대 판교점에 두 번째로 팝업을 열어 주요 입지의 연간 재방문 모델을 검증했습니다.', '4월 동시 운영한 3개 프로젝트 중 하나로, 현대 판교점에 같은 해 두 번째로 팝업을 열었습니다. 주요 입지의 연간 재방문 모델과 여러 현장을 동시에 조율하는 운영 역량을 검증했습니다.'],
          ['2604 · 신세계백화점 강남점', '3개 팝업 동시 운영 · 4월', '2025년 매출 1위 백화점에 처음 팝업을 열었습니다. 판교점 프로젝트와 같은 달에 병행하며 신세계와 현대 두 백화점 채널을 함께 운영했습니다.', '국내 매출 1위 백화점에 처음으로 팝업을 열고 판교점 프로젝트와 동시에 운영했습니다. 신세계와 현대 두 주요 백화점 채널을 함께 다루며 상위권 매장에서의 대형 팝업 운영 방식을 검증했습니다.'],
          ['2604 · 롯데 잠실월드몰', '스포츠 테마 부스 팝업', '4월의 주요 팝업과 연계한 부스형 팝업으로 제품군의 추가 노출을 확보했습니다.', '4월 판교점과 신세계 강남점의 주요 팝업을 보완하는 부스형 팝업을 운영했습니다. 제품군을 추가로 노출하고 비용과 준비 부담이 낮은 기동형 부스 운영 방식을 시험했습니다.'],
          ['2604 · 더현대 서울', '장기 팝업 매장', '현대백화점 서울 플래그십에서 43일간 운영하며 단기 팝업에서 매장형 운영으로 확장했습니다.', '현대백화점 스포츠 층에 장기 운영 팝업 매장을 열고 층의 고객층에 맞춰 상품을 구성했습니다. 신제품과 연계한 러닝 크루 행사를 열고 커뮤니티 운영으로 고객 참여를 높였습니다. 진열 디자인을 통해 프리미엄 제품의 노출을 강화하며 장기 팝업을 소형 브랜드 체험 매장처럼 운영할 수 있는지 검증했습니다.'],
          ['2605 · 롯데백화점 동탄점', '일반 팝업', '수도권 신도시의 가족 고객을 겨냥한 14일 팝업입니다.', '수도권 신도시의 가족 고객에게 집중적으로 다가가며 신도시 상권의 팝업 적합성과 가족 대상 콘텐츠 운영 방식을 검증했습니다.'],
          ['2606 · 하남 스타필드', '신제품 전략형 팝업', 'OpenDots 2 신제품을 중심으로 복합쇼핑몰에서 진행하며 백화점 외 리테일 공간에서의 팝업 적합성을 검증했습니다.', '경기도 하남 스타필드 1층에서 OpenDots 2 신제품 체험과 현장 구매를 유도했습니다. 복합쇼핑몰의 다양한 시설과 가족 고객층을 활용해 백화점 외 리테일 공간에서의 팝업 적합성을 검증했습니다.'],
          ['2607 · 신세계백화점 센텀시티점', '신제품 팝업 · 수도권 외 지역', '신세계 센텀시티에서 부산 첫 팝업을 열어 부산권 시장으로 확장했습니다.', '전국 백화점 매출 3위인 신세계 센텀시티에서 부산권 첫 팝업을 열었습니다. 이를 통해 수도권 밖 주요 지역 상권으로 운영 방식을 확장할 수 있는지 검증했습니다.'],
          ['2607 · 롯데 잠실월드몰', '신제품 전략형 팝업', '서초 핵심 상권에서 21일간 운영하며 가족과 직장인 고객층에 함께 다가갔습니다.', '서초 상권에서 21일간 가족과 직장인 고객을 대상으로 운영했습니다. 4월의 부스형 팝업와 함께, 가벼운 단기 행사와 본격적인 장기 팝업을 같은 입지에서 병행하는 방식을 시험했습니다.'],
          ['2610 · 롯데백화점 인천점', '브랜드 단독 매장 사전 테스트', '2026년 10월 시작 예정인 인천권 장기 팝업입니다. 공항 입국객까지 대상으로 하며, 종료일은 아직 정해지지 않았습니다. 10월에 계획된 3개 프로젝트 중 하나입니다.', '2026.10.01 시작 예정인 장기 팝업 매장으로 인천권 고객과 공항 입국객을 대상으로 기획했습니다. 종료일은 미정입니다. 더현대 서울·평촌점 프로젝트와 함께 10월의 3개 병행 프로젝트를 계획하며 지역 장기 매장과 여러 현장 운영을 결합하는 방식을 시험할 예정입니다.'],
          ['2610 · 더현대 서울', '핵심 상권 · 장기 팝업', '2025년 9월과 2026년 4~6월에 이어 같은 입지를 세 번째로 활용할 계획입니다.', '2025년 9월 팝업과 2026년 4~6월 장기 매장에 이어 10월에 28일간 세 번째로 운영할 계획입니다. 주요 입지를 반복 활용해 장소 협업과 고객 유입 운영에 관한 장기 관계를 쌓는 모델을 시험할 예정입니다.'],
          ['2610 · 롯데백화점 평촌점', '채널 자원 교환형 팝업', '수도권 서부 신도시의 가족 고객을 대상으로 기획한 10월의 3개 프로젝트 중 하나입니다.', '수도권 서부 신도시 고객을 대상으로 기획한 10월의 3개 프로젝트 중 하나입니다. 인천과 서울 프로젝트와 함께 경기·인천·서울의 세 지역을 연계할 예정입니다.']
        ]
      };

      function initRevealMotion() {
        const selectors = '.section-heading, .experience-head, .timeline-item, .tab-summary, .project-card, .skill-card, .language-chip, .contact-item';
        const nodes = [...document.querySelectorAll(selectors)];
        nodes.forEach(node => {
          node.classList.add('reveal');
          const group = node.closest('.timeline, .project-grid, .skills-grid, .language-list, .contact-list');
          const localIndex = group ? [...group.children].indexOf(node) : 0;
          node.style.setProperty('--reveal-delay', `${Math.max(0, localIndex % 4) * 70}ms`);
        });
        if (reducedMotion.matches || !('IntersectionObserver' in window)) {
          nodes.forEach(node => node.classList.add('is-revealed'));
          return;
        }
        document.documentElement.classList.add('motion-ready');
        revealObserver = new IntersectionObserver(entries => {
          const visibleEntries = entries.filter(entry => entry.isIntersecting);
          const isMobile = window.matchMedia('(max-width: 767px)').matches;
          visibleEntries.forEach((entry, visibleIndex) => {
            const step = isMobile ? Math.min(visibleIndex, 3) * 50 : Math.min(visibleIndex, 5) * 60;
            entry.target.style.setProperty('--reveal-delay', `${step}ms`);
            entry.target.classList.add('is-revealed');
            revealObserver.unobserve(entry.target);
          });
        }, { threshold: .12, rootMargin: '0px 0px -8% 0px' });
        nodes.forEach(node => revealObserver.observe(node));
      }

      function animateHighlightNumbers() {
        if (highlightCountPlayed) return;
        highlightCountPlayed = true;
        const targets = I18N[currentLang].highlights.map(item => Number(item.num));
        const nodes = [...document.querySelectorAll('[data-hl-num]')];
        if (reducedMotion.matches || nodes.length !== targets.length) {
          nodes.forEach((node, index) => { node.textContent = String(targets[index] ?? ''); });
          return;
        }
        const started = performance.now();
        const frame = now => {
          if (reducedMotion.matches) {
            nodes.forEach((node, index) => { node.textContent = String(targets[index] ?? ''); });
            return;
          }
          const progress = Math.min(1, (now - started) / MOTION.count);
          const eased = 1 - Math.pow(1 - progress, 3);
          nodes.forEach((node, index) => { node.textContent = String(Math.round((targets[index] || 0) * eased)); });
          if (progress < 1) window.requestAnimationFrame(frame);
        };
        nodes.forEach(node => { node.textContent = '0'; });
        window.requestAnimationFrame(frame);
      }

      function initHighlightMotion() {
        const strip = document.querySelector('.highlight-strip');
        if (!strip) return;
        if (reducedMotion.matches || !('IntersectionObserver' in window)) {
          animateHighlightNumbers();
          return;
        }
        highlightObserver = new IntersectionObserver(entries => {
          if (!entries.some(entry => entry.isIntersecting)) return;
          animateHighlightNumbers();
          highlightObserver.disconnect();
        }, { threshold: .35 });
        highlightObserver.observe(strip);

        if (!element || reducedMotion.matches) return;
        const animations = typeof element.getAnimations === 'function' ? element.getAnimations() : [];
        animations.forEach(animation => {
          try { animation.finish(); } catch (_) { animation.cancel(); }
        });
        if (typeof element.animate !== 'function') return;
        element.animate(
          [{ opacity: .72, transform: `translateX(${direction > 0 ? 18 : -18}px)` }, { opacity: 1, transform: 'translateX(0)' }],
          { duration: MOTION.slow, easing: MOTION.easeOut, fill: 'none' }
        );
      }

        if (!dialogState) return;
        const meta = PROJECT_META[dialogState.type][dialogState.index];
        if (meta.compare && dialogState.compareMode === 'compare') {
          const after = meta.compare.after || [];
          const before = Array.isArray(meta.compare.before) ? meta.compare.before : [meta.compare.before];
          if (after.length > 1) {
            dialogState.afterIndex = (dialogState.afterIndex + 1) % after.length;
            renderCompare();
            animateMedia(document.querySelector('[data-compare-after]'), 1);
          } else if (before.length > 1) {
            dialogState.beforeIndex = (dialogState.beforeIndex + 1) % before.length;

        const images = meta.images || [];

        dialogState.imageIndex = (dialogState.imageIndex + 1) % images.length;
        renderCompare();
        animateMedia(document.querySelector('[data-pd-image]'), 1);

        const next = document.querySelector(`[data-view="${target.id}"]`);
        if (!next || viewBusy) return false;

        if (target.id === currentView && !next.hidden) {
          const sameViewTarget = animate && anchor === 'languages' ? document.getElementById(anchor) : null;
          sameViewTarget?.scrollIntoView({ behavior: reducedMotion.matches ? 'auto' : 'smooth', block: 'start' });
          if (!sameViewTarget) window.scrollTo({ top: 0, behavior: 'auto' });
          setActiveNav(target.nav);
          return true;
        }

        viewBusy = true;
        document.querySelector('.nav-shell').classList.add('is-switching');
        const shouldAnimate = animate && !reducedMotion.matches && current && !current.hidden;
        if (shouldAnimate) {
          await current.animate(
            [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-8px)' }],
            { duration: MOTION.fast, easing: MOTION.easeInOut, fill: 'forwards' }
          ).finished.catch(() => {});
        }

        document.querySelectorAll('[data-view]').forEach(view => {
          const active = view === next;
          view.hidden = !active;
          view.classList.toggle('is-active', active);
          view.getAnimations().forEach(animation => animation.cancel());
          view.style.opacity = '';
          view.style.transform = '';
        });
        window.scrollTo({ top: 0, behavior: 'auto' });

        if (shouldAnimate) {
          await next.animate(
            [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }],
            { duration: MOTION.base, easing: MOTION.easeOut }
          ).finished.catch(() => {});
        }

        finalizeView(target.id, focusHeading, announce);
        if (anchor === 'languages') document.getElementById('languages')?.scrollIntoView({ behavior: 'auto', block: 'start' });
        return true;
      }

      function routeFromLocation(animate = true) {
        const rawHash = window.location.hash.replace(/^#/, '').toLowerCase();
        const view = findView(rawHash) || VIEWS[0];
        return setView(view.id, { animate, focusHeading: animate, announce: animate, anchor: rawHash });
      }

      function buildFramework() {
        document.querySelector('[data-highlights]').innerHTML = Array.from({ length: 6 }, (_, index) => `<div class="highlight-item"><dt class="highlight-value"><span aria-hidden="true" data-hl-visual="${index}"></span><span class="sr-only" data-hl-alt="${index}"></span></dt><dd class="highlight-label" data-highlight-label="${index}"></dd></div>`).join('');
        document.querySelector('[data-timeline]').innerHTML = Array.from({ length: 6 }, (_, index) => `<article class="timeline-item"><h3 data-exp-title="${index}"></h3><ol class="experience-points" data-exp-points="${index}"></ol></article>`).join('');

        document.querySelector('[data-tabs]').innerHTML = PROJECT_TYPES.map((type, index) => `<button class="tab" type="button" role="tab" id="tab-${type}" aria-controls="panel-${type}" aria-selected="${index === 0}" tabindex="${index === 0 ? 0 : -1}" data-project-tab="${type}"></button>`).join('') + '<span class="tabs-indicator" aria-hidden="true"></span>';
        const factCounts = { popup: 6, ka: 4, display: 4, airline: 3 };
        document.querySelector('[data-tab-panels]').innerHTML = PROJECT_TYPES.map((type, typeIndex) => `<div class="panel" id="panel-${type}" role="tabpanel" aria-labelledby="tab-${type}" data-project-panel="${type}" ${typeIndex === 0 ? '' : 'hidden'}><section class="tab-summary" aria-labelledby="tab-summary-${type}-title"><h3 id="tab-summary-${type}-title" data-tab-summary-title="${type}"></h3><p class="tab-summary__lead" data-tab-summary-lead="${type}"></p><p class="tab-summary__note" data-tab-summary-note="${type}"></p><dl class="tab-summary__stats" data-tab-summary-stats="${type}"></dl></section><div class="project-grid">${PROJECT_META[type].map((meta, index) => {
          const featured = Boolean(meta.images?.length);
          const coverImage = featured ? meta.images[meta.coverIndex || 0] : null;
          const cover = featured
            ? `<div class="project-cover has-media"><span class="project-badge" data-project-badge ${meta.strategic || meta.planned ? '' : 'hidden'}></span><div class="project-media-stage"><div class="project-media-track"><figure class="project-media-slide"><img src="${coverImage.src.replace('.webp', '-thumb.webp')}" alt="" loading="lazy" decoding="async" data-project-image></figure></div></div></div>`
            : `<div class="project-cover"><span class="project-badge" data-project-badge ${meta.strategic || meta.planned ? '' : 'hidden'}></span><div class="project-placeholder">${icon.image}<span data-project-image></span></div></div>`;
          return `<article class="project-card ${featured ? 'project-card--featured' : 'project-card--compact'}" data-project-card="${type}" data-project-index="${index}">${cover}<div class="project-body"><div class="project-meta"><span class="chip chip--date" data-project-date></span><span class="chip" data-project-type></span><span class="project-media-count" data-project-image-count ${featured ? '' : 'hidden'}></span></div><h3 data-project-title></h3><p data-project-summary></p><button class="project-action" type="button" aria-haspopup="dialog" aria-controls="project-dialog"><span data-project-action></span>${icon.arrow}</button></div><div class="project-detail"><div class="project-detail-inner"><section class="detail-section"><h4 data-project-context></h4><dl class="fact-grid">${Array.from({ length: factCounts[type] }, (_, factIndex) => `<div class="fact"><dt data-fact-label="${factIndex}"></dt><dd data-fact-value="${factIndex}"></dd></div>`).join('')}</dl></section><section class="detail-section"><h4 data-project-narrative></h4><p class="project-detail-copy" data-project-detail-copy></p></section><section class="detail-section" data-results-section><h4 data-project-outcomes></h4><div class="result-row" data-results></div><p class="result-note" data-result-note></p></section></div></div></article>`;
        }).join('')}</div></div>`).join('');

        document.querySelector('[data-skills]').innerHTML = Array.from({ length: 6 }, (_, index) => `<article class="skill-card"><div class="skill-head"><span class="skill-icon">${icon.skills[index]}</span><h3 data-skill-title="${index}"></h3></div><div class="tag-row" data-skill-tags="${index}"></div></article>`).join('');
        document.querySelector('[data-language-list]').innerHTML = Array.from({ length: 3 }, (_, index) => `<div class="language-chip"><strong data-language-item="${index}"></strong></div>`).join('');
        const contactIcons = [icon.mail, icon.location, icon.phone];
        document.querySelector('[data-contact-list]').innerHTML = Array.from({ length: 3 }, (_, index) => `<div class="contact-item"><span class="contact-icon">${contactIcons[index]}</span><span class="contact-copy"><small data-contact-label="${index}"></small><strong data-contact-value="${index}"></strong></span></div>`).join('') + `<div class="contact-item contact-travel"><span class="contact-icon">${icon.travel}</span><span class="contact-copy"><strong data-contact-travel></strong></span></div>`;
      }

      function projectCopy(type, index) {
        return type === 'popup' ? POPUP_COPY[currentLang][index] : CASE_COPY[currentLang][type][index];
      }

      function formatProjectDate(value) {
        const parts = value.split(' · ');
        if (parts.length < 2) return value;
        const suffix = currentLang === 'zh' ? ' 天' : currentLang === 'ko' ? '일' : Number(parts[1]) === 1 ? ' day' : ' days';
        return `${parts[0]} · ${parts[1]}${suffix}`;
      }

      function formatMediaCount(count) {
        if (currentLang === 'ko') return `${count}${I18N[currentLang].projects.imageUnit}`;
        return `${count} ${I18N[currentLang].projects.imageUnit}`;
      }

      function renderProjects() {
        const t = I18N[currentLang];
        PROJECT_TYPES.forEach(type => {
          const summary = TAB_SUMMARY[currentLang][type];
          document.querySelector(`[data-tab-summary-title="${type}"]`).textContent = summary.title;
          document.querySelector(`[data-tab-summary-lead="${type}"]`).textContent = summary.lead;
          document.querySelector(`[data-tab-summary-note="${type}"]`).textContent = summary.note;
          document.querySelector(`[data-tab-summary-stats="${type}"]`).innerHTML = summary.stats.map(([value, label]) => `<div><dd>${value}</dd><dt>${label}</dt></div>`).join('');
        });
        document.querySelectorAll('[data-project-card]').forEach(card => {
          const type = card.dataset.projectCard;
          const index = Number(card.dataset.projectIndex);
          const meta = PROJECT_META[type][index];
          const copy = projectCopy(type, index);
          const factValues = type === 'popup' ? VENUES[currentLang][meta.venue] : copy[4];
          card.querySelector('[data-project-date]').textContent = formatProjectDate(meta.date);
          card.querySelector('[data-project-type]').textContent = copy[1];
          card.querySelector('[data-project-title]').textContent = copy[0];
          card.querySelector('[data-project-summary]').textContent = copy[2];
          card.querySelector('[data-project-detail-copy]').textContent = copy[3];
          const imageNode = card.querySelector('[data-project-image]');
          if (imageNode instanceof HTMLImageElement) {
            imageNode.alt = formatImageAlt(copy[0], type, (meta.coverIndex || 0) + 1);
            card.querySelector('[data-project-image-count]').textContent = formatMediaCount(meta.images.length);
          } else {
            imageNode.textContent = meta.planned ? t.projects.imagePlanned : t.projects.image;
          }
          card.querySelector('[data-project-context]').textContent = t.projects.context;
          card.querySelector('[data-project-narrative]').textContent = t.projects.narrative;
          card.querySelector('[data-project-outcomes]').textContent = t.projects.outcomes;
          card.querySelector('[data-project-action]').textContent = t.projects.view;
          const badge = card.querySelector('[data-project-badge]');
          badge.hidden = !meta.strategic && !meta.planned;
          badge.textContent = meta.planned ? t.projects.planned : t.projects.strategic;
          const labels = t.projects.factLabels[type];
          card.querySelectorAll('[data-fact-label]').forEach((node, factIndex) => { node.textContent = labels[factIndex] || ''; });
          card.querySelectorAll('[data-fact-value]').forEach((node, factIndex) => { node.textContent = factValues[factIndex] || ''; });
          const results = card.querySelector('[data-results]');
          const resultItems = (meta.results || []).map(([value, key]) => `<span class="chip chip--accent">${value} · ${RESULT_LABELS[currentLang][key]}</span>`);
          results.innerHTML = resultItems.join('');
          card.querySelector('[data-result-note]').textContent = t.projects.resultNote;
          card.querySelector('[data-results-section]').hidden = resultItems.length === 0;
        });
        if (dialogState) renderProjectDialog();
      }

      function formatImageAlt(title, type, index) {
        if (currentLang === 'en') return `${title} · ${MEDIA_ALTS.en[type]} · Image ${index}`;
        if (currentLang === 'ko') return `${title} · ${MEDIA_ALTS.ko[type]} · ${index}번째 이미지`;
        return `${title} · ${MEDIA_ALTS.zh[type]} · 第 ${index} 张`;
      }

      function projectFacts(type, index) {
        const meta = PROJECT_META[type][index];
        const copy = projectCopy(type, index);
        return type === 'popup' ? VENUES[currentLang][meta.venue] : copy[4];
      }

      function resultMarkup(meta) {
        const items = (meta.results || []).map(([value, key]) => `<span class="chip chip--accent">${value} · ${RESULT_LABELS[currentLang][key]}</span>`);
        return items.join('');
      }

      function renderGallery() {
        if (!dialogState) return;
        const { type, index } = dialogState;
        const meta = PROJECT_META[type][index];
        const copy = projectCopy(type, index);
        const images = meta.images || [];
        const image = document.querySelector('[data-pd-image]');
        const main = document.querySelector('[data-pd-main]');
        const placeholder = document.querySelector('[data-pd-placeholder]');
        const prev = document.querySelector('[data-pd-prev]');
        const next = document.querySelector('[data-pd-next]');
        const counter = document.querySelector('[data-pd-counter]');
        const thumbs = document.querySelector('[data-pd-thumbs]');
        if (!images.length) {
          main.classList.remove('is-portrait');
          image.hidden = true;
          image.removeAttribute('src');
          placeholder.hidden = false;
          placeholder.innerHTML = `${icon.image}<span>${I18N[currentLang].projects.image}</span>`;
          prev.disabled = true;
          next.disabled = true;
          counter.textContent = '0 / 0';
          thumbs.innerHTML = '';
          thumbs.hidden = true;
          return;
        }
        dialogState.imageIndex = Math.max(0, Math.min(dialogState.imageIndex, images.length - 1));
        const current = images[dialogState.imageIndex];
        image.hidden = false;
        placeholder.hidden = true;
        main.classList.remove('is-portrait');
        const syncOrientation = () => {
          if (!image.currentSrc.endsWith(current.src)) return;
          main.classList.toggle('is-portrait', image.naturalHeight > image.naturalWidth * 1.15);
        };
        image.addEventListener('load', syncOrientation, { once: true });
        image.src = current.src;
        if (image.complete) syncOrientation();
        image.alt = formatImageAlt(copy[0], type, dialogState.imageIndex + 1);
        prev.disabled = dialogState.imageIndex === 0;
        next.disabled = dialogState.imageIndex === images.length - 1;
        counter.textContent = `${dialogState.imageIndex + 1} / ${images.length}`;
        thumbs.hidden = images.length < 2;
        thumbs.innerHTML = images.map((item, imageIndex) => `<li><button type="button" data-pd-thumb="${imageIndex}" aria-current="${imageIndex === dialogState.imageIndex}" aria-label="${formatImageAlt(copy[0], type, imageIndex + 1)}"><img src="${item.src.replace('.webp', '-thumb.webp')}" alt="" loading="lazy" decoding="async"></button></li>`).join('');
        [dialogState.imageIndex - 1, dialogState.imageIndex + 1].filter(i => images[i]).forEach(i => { const preload = new Image(); preload.src = images[i].src; });
        thumbs.querySelector('[aria-current="true"]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      }

      function renderCompare() {
        if (!dialogState) return;
        const { type, index } = dialogState;
        const meta = PROJECT_META[type][index];
        const copy = projectCopy(type, index);
        const compare = meta.compare;
        const t = I18N[currentLang].projects;
        const compareView = document.querySelector('[data-pd-compare]');
        const gallery = document.querySelector('[data-pd-gallery]');
        const showCompare = Boolean(compare && dialogState.compareMode === 'compare');
        compareView.hidden = !compare;
        compareView.classList.toggle('is-switch-only', Boolean(compare && !showCompare));
        gallery.hidden = showCompare;
        document.querySelectorAll('[data-compare-mode]').forEach(button => {
          button.textContent = button.dataset.compareMode === 'compare' ? t.compare : t.allImages;
          button.setAttribute('aria-pressed', String(button.dataset.compareMode === dialogState.compareMode));
        });
        const comparePane = compareView.querySelector('.compare-pane');
        const process = document.querySelector('[data-compare-process]');
        const note = document.querySelector('[data-compare-note]');
        comparePane.hidden = !showCompare;
        process.hidden = !showCompare || !compare?.process?.length;
        note.hidden = !showCompare;
        if (!showCompare) { renderGallery(); return; }
        const beforeImages = Array.isArray(compare.before) ? compare.before : [compare.before];
        const afterImages = compare.after;
        dialogState.beforeIndex = Math.max(0, Math.min(dialogState.beforeIndex, beforeImages.length - 1));
        dialogState.afterIndex = Math.max(0, Math.min(dialogState.afterIndex, afterImages.length - 1));
        const beforeIndex = beforeImages[dialogState.beforeIndex];
        const afterIndex = afterImages[dialogState.afterIndex];
        const beforeImage = document.querySelector('[data-compare-before]');
        const afterImage = document.querySelector('[data-compare-after]');
        beforeImage.src = meta.images[beforeIndex].src;
        beforeImage.alt = formatImageAlt(copy[0], type, beforeIndex + 1);
        afterImage.src = meta.images[afterIndex].src;
        afterImage.alt = formatImageAlt(copy[0], type, afterIndex + 1);
        document.querySelector('[data-compare-before-label]').textContent = t.before;
        document.querySelector('[data-compare-after-label]').textContent = t.after;
        document.querySelector('[data-compare-before-caption]').textContent = `${t.before} · ${dialogState.beforeIndex + 1} / ${beforeImages.length}`;
        document.querySelector('[data-compare-after-caption]').textContent = `${t.after} · ${dialogState.afterIndex + 1} / ${afterImages.length}`;
        document.querySelector('[data-compare-note]').textContent = t.compareNote;
        const beforeNav = document.querySelector('[data-compare-before-nav]');
        beforeNav.hidden = beforeImages.length < 2;
        document.querySelector('[data-compare-before-counter]').textContent = `${dialogState.beforeIndex + 1} / ${beforeImages.length}`;
        document.querySelector('[data-compare-before-prev]').disabled = dialogState.beforeIndex === 0;
        document.querySelector('[data-compare-before-next]').disabled = dialogState.beforeIndex === beforeImages.length - 1;
        const afterNav = document.querySelector('[data-compare-after-nav]');
        afterNav.hidden = afterImages.length < 2;
        document.querySelector('[data-compare-counter]').textContent = `${dialogState.afterIndex + 1} / ${afterImages.length}`;
        document.querySelector('[data-compare-prev]').disabled = dialogState.afterIndex === 0;
        document.querySelector('[data-compare-next]').disabled = dialogState.afterIndex === afterImages.length - 1;
        document.querySelector('[data-compare-process-label]').textContent = t.process;
        document.querySelector('[data-compare-process-list]').innerHTML = (compare.process || []).map(imageIndex => `<li><button type="button" data-process-image="${imageIndex}" aria-label="${formatImageAlt(copy[0], type, imageIndex + 1)}"><img src="${meta.images[imageIndex].src.replace('.webp', '-thumb.webp')}" alt="" loading="lazy" decoding="async"></button></li>`).join('');
      }

      function renderProjectDialog() {
        if (!dialogState) return;
        const { type, index } = dialogState;
        const meta = PROJECT_META[type][index];
        const copy = projectCopy(type, index);
        const t = I18N[currentLang].projects;
        document.querySelector('[data-pd-date]').textContent = formatProjectDate(meta.date);
        document.querySelector('[data-pd-type]').textContent = copy[1];
        document.querySelector('[data-pd-title]').textContent = copy[0];
        document.querySelector('[data-pd-context]').textContent = t.context;
        document.querySelector('[data-pd-narrative-label]').textContent = t.narrative;
        document.querySelector('[data-pd-outcomes-label]').textContent = t.outcomes;
        document.querySelector('[data-pd-narrative]').textContent = copy[3];
        const labels = t.factLabels[type];
        document.querySelector('[data-pd-facts]').innerHTML = projectFacts(type, index).map((value, factIndex) => `<div class="fact"><dt>${labels[factIndex] || ''}</dt><dd>${value}</dd></div>`).join('');
        const results = resultMarkup(meta);
        document.querySelector('[data-pd-results]').innerHTML = results;
        document.querySelector('[data-pd-result-note]').textContent = t.resultNote;
        document.querySelector('[data-pd-results-section]').hidden = !results;
        renderCompare();
        syncAutoplayButton();
      }

      function openProjectDialog(button) {
        const card = button.closest('[data-project-card]');
        const type = card.dataset.projectCard;
        const index = Number(card.dataset.projectIndex);
        const meta = PROJECT_META[type][index];
        dialogState = { type, index, imageIndex: meta.coverIndex || 0, compareMode: meta.compare ? 'compare' : 'all', beforeIndex: 0, afterIndex: 0, autoplayPaused: false, opener: button };
        renderProjectDialog();
        const dialog = document.querySelector('[data-project-dialog]');
        dialog.classList.remove('is-closing');
        document.body.classList.add('dialog-open');
        dialog.showModal();
        dialog.scrollTop = 0;
        dialog.focus({ preventScroll: true });
        startProjectAutoplay();
      }

      function closeProjectDialog() {
        const dialog = document.querySelector('[data-project-dialog]');
        if (!dialog.open || dialog.classList.contains('is-closing')) return;
        stopProjectAutoplay();
        if (reducedMotion.matches) { dialog.close(); return; }
        dialog.classList.add('is-closing');
        window.setTimeout(() => dialog.open && dialog.close(), MOTION.fast);
      }

      function stepGallery(delta) {
        if (!dialogState) return;
        const images = PROJECT_META[dialogState.type][dialogState.index].images || [];
        if (!images.length) return;
        dialogState.compareMode = 'all';
        dialogState.imageIndex = Math.max(0, Math.min(dialogState.imageIndex + delta, images.length - 1));
        renderCompare();
        animateMedia(document.querySelector('[data-pd-image]'), delta);
      }

      function renderHighlights() {
        const highlights = I18N[currentLang].highlights;
        document.querySelectorAll('[data-hl-visual]').forEach(node => {
          const item = highlights[Number(node.dataset.hlVisual)];
          node.innerHTML = `${item.sign ? `<span class="hl-mark hl-mark--sign">${item.sign}</span>` : ''}<span class="hl-num" data-hl-num>${item.num}</span>${item.suffix ? `<span class="hl-mark hl-mark--suffix">${item.suffix}</span>` : ''}`;
        });
        document.querySelectorAll('[data-hl-alt]').forEach(node => { node.textContent = highlights[Number(node.dataset.hlAlt)].alt; });
        document.querySelectorAll('[data-highlight-label]').forEach(node => { node.textContent = highlights[Number(node.dataset.highlightLabel)].label; });
      }

      function renderLanguage() {
        const t = I18N[currentLang];
        document.documentElement.lang = LANG_TAGS[currentLang];
        document.title = t.meta.title;
        document.querySelector('meta[name="description"]').content = t.meta.description;
        document.querySelector('meta[property="og:title"]').content = t.meta.title;
        document.querySelector('meta[property="og:description"]').content = t.meta.description;

        document.querySelectorAll('[data-i18n]').forEach(node => { const value = get(node.dataset.i18n, t); if (typeof value === 'string') node.textContent = value; });
        document.querySelectorAll('[data-i18n-aria]').forEach(node => { const value = get(node.dataset.i18nAria, t); if (typeof value === 'string') node.setAttribute('aria-label', value); });
        document.querySelectorAll('[data-nav-key]').forEach(node => { node.textContent = t.nav[node.dataset.navKey]; });
        document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === currentLang)));
        renderHighlights();
        document.querySelectorAll('[data-exp-title]').forEach(node => { node.textContent = t.experience.items[Number(node.dataset.expTitle)].title; });
        document.querySelectorAll('[data-exp-points]').forEach(node => {
          const item = t.experience.items[Number(node.dataset.expPoints)];
          node.innerHTML = item.points.map(point => `<li><span>${point}</span></li>`).join('');
        });
        document.querySelectorAll('[data-project-tab]').forEach(node => { node.textContent = t.projects.tabs[node.dataset.projectTab]; });
        renderProjects();
        document.querySelectorAll('[data-skill-title]').forEach(node => { node.textContent = t.skills.items[Number(node.dataset.skillTitle)].title; });
        document.querySelectorAll('[data-skill-tags]').forEach(node => { node.innerHTML = t.skills.items[Number(node.dataset.skillTags)].tags.map(tag => `<span class="skill-tag">${tag}</span>`).join(''); });
        document.querySelectorAll('[data-language-item]').forEach(node => { node.textContent = t.languages.items[Number(node.dataset.languageItem)]; });
        document.querySelectorAll('[data-contact-label]').forEach(node => { node.textContent = t.contact.items[Number(node.dataset.contactLabel)].label; });
        document.querySelectorAll('[data-contact-value]').forEach(node => {
          const item = t.contact.items[Number(node.dataset.contactValue)];
          if (item.key === 'email') node.innerHTML = `<a href="mailto:${item.value}">${item.value}</a>`;
          else node.textContent = item.value;
        });
        document.querySelector('[data-contact-travel]').textContent = t.contact.travel;
        const printEmail = t.contact.items.find(item => item.key === 'email')?.value || '';
        const printLocation = t.contact.items.find(item => item.key === 'location')?.value || '';
        document.querySelector('[data-print-name]').textContent = `${t.brand.name} · Jumpson`;
        document.querySelector('[data-print-contact]').textContent = `${printEmail} · ${printLocation}`;
        document.querySelector('[data-view-announcer]').textContent = t.views[currentView];
        syncAutoplayButton();
        setActiveNav(currentView);
        updateIndicator();
      }

      function setLanguage(lang, animate = true) {
        if (!I18N[lang] || lang === currentLang) return;
        const apply = () => {
          currentLang = lang;
          storage.set('resume-lang', lang);
          const url = new URL(window.location.href);
          lang === 'zh' ? url.searchParams.delete('lang') : url.searchParams.set('lang', lang);
          history.replaceState(null, '', url);
          renderLanguage();
        };
        if (!animate || reducedMotion.matches) { apply(); return; }
        apply();
        document.body.classList.add('lang-enter');
        window.setTimeout(() => document.body.classList.remove('lang-enter'), MOTION.fast + 30);
      }

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        storage.set('resume-theme', theme);
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0F1215' : '#F7F8FA';
        document.querySelectorAll('.theme-toggle').forEach((button, index) => {
          if (index === 0) button.innerHTML = icon.theme(theme);
          button.setAttribute('aria-label', I18N[currentLang].actions.theme);
        });
      }

      function updateIndicator() {
        const active = document.querySelector(`[data-project-tab="${currentProject}"]`);
        const indicator = document.querySelector('.tabs-indicator');
        const first = document.querySelector('[data-project-tab]');
        if (!active || !indicator || !first?.offsetWidth) return;
        indicator.style.width = `${first.offsetWidth}px`;
        indicator.style.transform = `translateX(${active.offsetLeft}px) scaleX(${active.offsetWidth / first.offsetWidth})`;
      }

      function setProject(type, focus = false) {
        if (!PROJECT_TYPES.includes(type) || type === currentProject || tabBusy) return;
        const oldPanel = document.querySelector(`[data-project-panel="${currentProject}"]`);
        const newPanel = document.querySelector(`[data-project-panel="${type}"]`);
        tabBusy = true;
        document.querySelectorAll('[data-project-tab]').forEach(tab => {
          const selected = tab.dataset.projectTab === type;
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
          if (selected && focus) tab.focus();
        });
        currentProject = type;
        updateIndicator();
        const finish = () => {
          oldPanel.hidden = true;
          newPanel.hidden = false;
          newPanel.style.animation = 'none';
          void newPanel.offsetWidth;
          newPanel.style.animation = '';
          window.setTimeout(() => { tabBusy = false; }, reducedMotion.matches ? 10 : MOTION.base + 10);
        };
        if (reducedMotion.matches) { finish(); return; }
        oldPanel.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-8px)' }], { duration: MOTION.fast, easing: MOTION.easeOut, fill: 'forwards' }).finished.then(finish);
      }

      function openDrawer() {
        const drawer = document.querySelector('.drawer');
        drawer.inert = false;
        drawer.classList.add('is-open');
        document.querySelector('[data-drawer-backdrop]').classList.add('is-open');
        drawer.setAttribute('aria-hidden', 'false');
        document.querySelector('.menu-button').setAttribute('aria-expanded', 'true');
        document.body.classList.add('drawer-open');
        document.querySelectorAll('.nav-shell, main, footer').forEach(node => { node.inert = true; });
        document.querySelector('.drawer-close').focus();
      }
      function closeDrawer(returnFocus = false) {
        const drawer = document.querySelector('.drawer');
        drawer.classList.remove('is-open');
        document.querySelector('[data-drawer-backdrop]').classList.remove('is-open');
        drawer.setAttribute('aria-hidden', 'true');
        drawer.inert = true;
        document.querySelector('.menu-button').setAttribute('aria-expanded', 'false');
        document.body.classList.remove('drawer-open');
        document.querySelectorAll('.nav-shell, main, footer').forEach(node => { node.inert = false; });
        if (returnFocus) document.querySelector('.menu-button').focus();
      }

      function bindEvents() {
        document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
        document.querySelectorAll('.theme-toggle').forEach(button => button.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')));
        document.querySelectorAll('.print-button').forEach(button => button.addEventListener('click', () => window.print()));
        document.querySelector('.menu-button').addEventListener('click', openDrawer);
        document.querySelector('.drawer-close').addEventListener('click', () => closeDrawer(true));
        document.querySelector('[data-drawer-backdrop]').addEventListener('click', () => closeDrawer(false));
        document.querySelector('.back-to-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: reducedMotion.matches ? 'auto' : 'smooth' }));
        document.addEventListener('click', event => {
          const link = event.target.closest('a[href^="#"]');
          if (!link) return;
          const hash = link.getAttribute('href').slice(1).toLowerCase();
          const targetView = findView(hash);
          if (!targetView) return;
          event.preventDefault();
          if (viewBusy) return;
          if (document.querySelector('.drawer').classList.contains('is-open')) closeDrawer(false);
          history.pushState(null, '', `#${hash || targetView.id}`);
          setView(targetView.id, { animate: true, focusHeading: true, announce: true, anchor: hash });
        });
        document.querySelectorAll('[data-project-tab]').forEach(tab => {
          tab.addEventListener('click', () => setProject(tab.dataset.projectTab));
          tab.addEventListener('keydown', event => {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
            event.preventDefault();
            const current = PROJECT_TYPES.indexOf(tab.dataset.projectTab);
            const next = event.key === 'Home' ? 0 : event.key === 'End' ? PROJECT_TYPES.length - 1 : (current + (event.key === 'ArrowRight' ? 1 : -1) + PROJECT_TYPES.length) % PROJECT_TYPES.length;
            setProject(PROJECT_TYPES[next], true);
          });
        });
        document.querySelectorAll('.project-action').forEach(button => {
          button.addEventListener('click', () => openProjectDialog(button));
        });
        const dialog = document.querySelector('[data-project-dialog]');
        document.querySelector('[data-pd-close]').addEventListener('click', closeProjectDialog);
        document.querySelector('[data-pd-prev]').addEventListener('click', () => { stopProjectAutoplay(true); stepGallery(-1); });
        document.querySelector('[data-pd-next]').addEventListener('click', () => { stopProjectAutoplay(true); stepGallery(1); });
        document.querySelector('[data-compare-before-prev]').addEventListener('click', () => { if (dialogState) { stopProjectAutoplay(true); dialogState.beforeIndex -= 1; renderCompare(); animateMedia(document.querySelector('[data-compare-before]'), -1); } });
        document.querySelector('[data-compare-before-next]').addEventListener('click', () => { if (dialogState) { stopProjectAutoplay(true); dialogState.beforeIndex += 1; renderCompare(); animateMedia(document.querySelector('[data-compare-before]'), 1); } });
        document.querySelector('[data-compare-prev]').addEventListener('click', () => { if (dialogState) { stopProjectAutoplay(true); dialogState.afterIndex -= 1; renderCompare(); animateMedia(document.querySelector('[data-compare-after]'), -1); } });
        document.querySelector('[data-compare-next]').addEventListener('click', () => { if (dialogState) { stopProjectAutoplay(true); dialogState.afterIndex += 1; renderCompare(); animateMedia(document.querySelector('[data-compare-after]'), 1); } });
        document.querySelector('[data-pd-autoplay]').addEventListener('click', () => {
          if (!dialogState) return;
          if (autoplayTimer) stopProjectAutoplay(true);
          else { dialogState.autoplayPaused = false; startProjectAutoplay(); }
        });
        dialog.addEventListener('click', event => { if (event.target === dialog) closeProjectDialog(); });
        dialog.addEventListener('cancel', event => { event.preventDefault(); closeProjectDialog(); });
        dialog.addEventListener('close', () => {
          clearProjectAutoplay();
          document.body.classList.remove('dialog-open');
          dialog.classList.remove('is-closing');
          const opener = dialogState?.opener;
          dialogState = null;
          opener?.focus({ preventScroll: true });
        });
        dialog.addEventListener('click', event => {
          const thumb = event.target.closest('[data-pd-thumb]');
          if (thumb && dialogState) { const previous = dialogState.imageIndex; stopProjectAutoplay(true); dialogState.imageIndex = Number(thumb.dataset.pdThumb); renderGallery(); animateMedia(document.querySelector('[data-pd-image]'), dialogState.imageIndex >= previous ? 1 : -1); return; }
          const mode = event.target.closest('[data-compare-mode]');
          if (mode && dialogState) { stopProjectAutoplay(true); dialogState.compareMode = mode.dataset.compareMode; renderCompare(); return; }
          const process = event.target.closest('[data-process-image]');
          if (process && dialogState) { stopProjectAutoplay(true); dialogState.compareMode = 'all'; dialogState.imageIndex = Number(process.dataset.processImage); renderCompare(); animateMedia(document.querySelector('[data-pd-image]'), 1); }
        });
        dialog.addEventListener('keydown', event => {
          if (!dialogState || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const images = PROJECT_META[dialogState.type][dialogState.index].images || [];
          stopProjectAutoplay(true);
          dialogState.compareMode = 'all';
          if (event.key === 'Home') dialogState.imageIndex = 0;
          else if (event.key === 'End') dialogState.imageIndex = Math.max(0, images.length - 1);
          else dialogState.imageIndex += event.key === 'ArrowRight' ? 1 : -1;
          dialogState.imageIndex = Math.max(0, Math.min(dialogState.imageIndex, Math.max(0, images.length - 1)));
          renderCompare();
          animateMedia(document.querySelector('[data-pd-image]'), event.key === 'ArrowLeft' ? -1 : 1);
        });
        document.querySelector('[data-pd-main]').addEventListener('pointerdown', event => { swipeStartX = event.clientX; });
        document.querySelector('[data-pd-main]').addEventListener('pointerup', event => {
          if (swipeStartX === null) return;
          const distance = event.clientX - swipeStartX;
          swipeStartX = null;
          if (Math.abs(distance) >= 48) { stopProjectAutoplay(true); stepGallery(distance < 0 ? 1 : -1); }
        });
        document.addEventListener('keydown', event => { if (event.key === 'Escape' && document.querySelector('.drawer').classList.contains('is-open')) closeDrawer(true); });
        window.addEventListener('popstate', () => routeFromLocation(true));
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { clearProjectAutoplay(); syncAutoplayButton(); }
          else if (dialogState) startProjectAutoplay();
        });
        reducedMotion.addEventListener?.('change', () => {
          if (reducedMotion.matches) stopProjectAutoplay();
          else if (dialogState) startProjectAutoplay();
        });
        let resizeFrame = 0;
        window.addEventListener('resize', () => {
          window.cancelAnimationFrame(resizeFrame);
          resizeFrame = window.requestAnimationFrame(updateIndicator);
        });
        window.addEventListener('scroll', () => {
          const y = window.scrollY;
          document.querySelector('.nav-shell').classList.toggle('is-scrolled', y > 80);
          document.querySelector('.back-to-top').classList.toggle('is-visible', y > 600);
        }, { passive: true });
      }

      async function init() {
        buildNavigation();
        buildFramework();
        const params = new URL(window.location.href).searchParams;
        const requested = params.get('lang');
        currentLang = I18N[requested] ? requested : (I18N[storage.get('resume-lang')] ? storage.get('resume-lang') : 'zh');
        const savedTheme = storage.get('resume-theme');
        setTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        renderLanguage();
        initRevealMotion();
        bindEvents();
        await routeFromLocation(false);
        initHighlightMotion();
        playHomeIntro();
        requestAnimationFrame(updateIndicator);
      }

      init();
    })();
  </script>
</body>
</html>
